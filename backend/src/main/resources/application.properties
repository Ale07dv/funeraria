spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/funeraria
spring.datasource.username=funeraria
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Seguridad (valores solo para desarrollo; en el servidor se cambian) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-horas=10
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nombre=Administrador
app.admin.apellidos=FUASCEN
