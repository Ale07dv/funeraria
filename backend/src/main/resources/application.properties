spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/funeraria
spring.datasource.username=funeraria
spring.datasource.password=funeraria
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Seguridad (valores solo para desarrollo; en el servidor se cambian) ---
